<script>
    $(document).ready(function () {
        {% if site.google_scholar_stats_use_cdn %}
        var gsDataBaseUrl = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@'
        {% else %}
        var gsDataBaseUrl = 'https://raw.githubusercontent.com/{{ site.repository }}/'
        {% endif %}
        // Normalize titles so "FADRM: Fast and ..." matches regardless of case/punctuation
        function normTitle(t) {
            return (t || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
        }
        $.getJSON(gsDataBaseUrl + "google-scholar-stats/gs_data.json", function (data) {
            var totalCit = document.getElementById('total_cit');
            if (totalCit) totalCit.innerHTML = data['citedby'];

            var pubs = data['publications'] || {};
            var byTitle = {};
            Object.keys(pubs).forEach(function (id) {
                var bib = pubs[id]['bib'] || {};
                byTitle[normTitle(bib['title'])] = pubs[id];
            });

            // Each element can reference a paper by Scholar pub id (data="USER:PUB") or by title (data-title="...")
            var citationEles = document.getElementsByClassName('show_paper_citations');
            Array.prototype.forEach.call(citationEles, function (element) {
                var pub = pubs[element.getAttribute('data')] || byTitle[normTitle(element.getAttribute('data-title'))];
                if (pub && pub['num_citations'] !== undefined) {
                    element.innerHTML = '| Citations: ' + pub['num_citations'];
                }
            });
        });
    })
</script>
